[package]
namespace   = "mcpplibs"
name        = "xpkg"
version     = "0.0.68"
description = "C++23 reference implementation of the xpkg format"
license     = "Apache-2.0"
repo        = "https://github.com/openxlings/libxpkg"

[targets.xpkg]
kind = "lib"

[dependencies]
"mcpplibs.capi.lua" = "0.0.3"

[dev-dependencies]
gtest = "1.15.2"

# The migration tool (tools/xpkg-migrate.cpp): built only when asked for, so a
# package depending on this library does not build it.
[targets.xpkg-migrate]
kind = "bin"
main = "tools/xpkg-migrate.cpp"
required_features = ["tools"]

[features]
tools = []
