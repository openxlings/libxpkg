name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build + test (linux x86_64, mcpp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        env:
          XLINGS_VERSION: 2026.8.4.2
        run: |
          tarball="xlings-${XLINGS_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/d2learn/xlings/releases/download/v${XLINGS_VERSION}/${tarball}"
          tar -xzf "/tmp/${tarball}" -C /tmp
          "/tmp/xlings-${XLINGS_VERSION}-linux-x86_64/subos/default/bin/xlings" self install
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install workspace tools (.xlings.json → mcpp 2026.9.26.2)
        run: xlings install -y

      # Cache mcpp's self-bootstrapped sandbox (musl-gcc + binutils +
      # glibc + ninja + patchelf, ~800 MB). Toolchain set is pinned by the
      # mcpp version, so a fixed key per version suffices.
      - name: Cache mcpp sandbox
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs/xim-x-mcpp/2026.9.26.2/registry
          key: mcpp-sandbox-${{ runner.os }}-mcpp2026.9.26.2

      # build.mcpp regenerates the embedded Lua stdlib from src/lua-stdlib/
      # into MCPP_OUT_DIR. There is no committed copy to fall out of sync with.
      - name: Build with mcpp
        run: mcpp build

      # mcpp auto-prepends sandbox PATH (patchelf, ninja) for
      # test binaries, so Linux elfpatch tests run without manual PATH
      # setup. Only macOS-specific tests (need install_name_tool) are
      # filtered — they can't run on a Linux runner.
      - name: Run tests
        run: mcpp test -- --gtest_filter=-ExecutorTest.ApplyElfpatchAuto_*

  # What differs per OS runs on each of the three: the process layer
  # (src/xpkg-shell.cppm, libxpkg#52: `cmd /d /s /c` and CreateProcessW on
  # Windows, `/bin/sh -c` and posix_spawn elsewhere, a program's argument list
  # on both) and the module interface a hook calls (fs, system, pkginfo, path;
  # tests/test_api.cpp). The rest of the suite is Linux's (above).
  shell:
    name: shell and module interface tests (${{ matrix.os }}, mcpp)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      XLINGS_NON_INTERACTIVE: '1'
      MCPP_VERSION: 2026.11.22.1
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash
          test -x "$HOME/.xlings/bin/xlings"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"

      - name: Install xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = "$env:TEMP\xlings-quick-install.ps1"
          Invoke-WebRequest -UseBasicParsing -ErrorAction Stop `
            -Uri https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 `
            -OutFile $script
          & $script
          if (-not (Test-Path "$env:USERPROFILE\.xlings\bin\xlings.exe")) { exit 1 }
          "$env:USERPROFILE\.xlings\subos\current\bin" >> $env:GITHUB_PATH
          "$env:USERPROFILE\.xlings\bin" >> $env:GITHUB_PATH

      - name: Install mcpp
        shell: bash
        run: |
          xlings install "mcpp@${MCPP_VERSION}" -y
          xlings use mcpp "${MCPP_VERSION}"
          mcpp --version

      - name: Run the shell tests
        shell: bash
        run: mcpp test test_shell --toolchain llvm@23.1.3

      - name: Run the module interface tests
        shell: bash
        run: mcpp test test_api --toolchain llvm@23.1.3
